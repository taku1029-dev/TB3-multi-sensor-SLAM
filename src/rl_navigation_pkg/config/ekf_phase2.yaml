# EKF input gate wrapper — Phase 2 adds the lidar stream.
ekf_input_gate:
  ros__parameters:
    # Wheel: vx and vyaw fused. Order: [vx, vyaw].
    nominal_diagonal_wheel: [0.05, 0.05]

    # IMU: vyaw only. Order: [vyaw].
    nominal_diagonal_imu: [0.02]

    # LiDAR-odom: vx, vy, vyaw fused. Higher base noise than wheel — scan-matching
    # is noisier than encoder integration, especially on sparse / symmetric surroundings.
    # Order: [vx, vy, vyaw]. Retunable without an ADR.
    nominal_diagonal_lidar: [0.1, 0.1, 0.1]

    # σ multipliers — agent updates each cycle via set_parameters (ADR-014).
    sigma_wheel: 1.0
    sigma_imu: 1.0
    sigma_lidar: 1.0

    # Topic plumbing.
    raw_topic_wheel: /odom_wheel
    raw_topic_imu: /imu
    raw_topic_lidar: /odom_lidar
    private_topic_wheel: /ekf_in/odom_wheel
    private_topic_imu: /ekf_in/imu
    private_topic_lidar: /ekf_in/odom_lidar

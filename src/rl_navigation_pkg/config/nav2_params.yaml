# Nav2 parameters for the SAC-tuned-EKF SLAM project.
#
# Plugin selection is pinned by ADR-013 (NavfnPlanner + RegulatedPurePursuitController
# + stock BT + standard costmap layers). Numeric values below are TB3 Burger defaults
# and are tuning-grade per adr/013-nav2-planner-controller-selection.md:38 — adjust
# without writing a new ADR.
#
# Topic / frame contract:
#   - /lidar (sensor_msgs/LaserScan)  — obstacle layer input, per ADR-003.
#   - /cmd_vel                        — Nav2 owns this, per ADR-002:42.
#   - /map                            — from slam_toolbox, per ADR-007:21.
#   - TF: map -> odom -> base_footprint, with map->odom from slam_toolbox and
#     odom->base_footprint from the EKF (publish_tf: true required, per ADR-007:20).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.1
    # ADR-013 pins the stock recovery-equipped BT. In Nav2 Jazzy, **omit** these
    # params entirely so Nav2's built-in default kicks in (nav2_bt_navigator's
    # navigate_to_pose_w_replanning_and_recovery.xml). Setting them to "" loads
    # an empty tree and aborts; setting them to "$(find-pkg-share ...)" is a
    # launch-time substitution that yaml does NOT expand, so the literal string
    # gets passed to bt_navigator and the file lookup fails.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
      stateful: True

    # ADR-013 plugin selection: Regulated Pure Pursuit. Deterministic by construction;
    # no sampling-based velocity search.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22          # TB3 Burger ceiling
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      rotate_to_heading_angular_vel: 1.8
      allow_reversing: false             # TB3 Burger forward-only navigation

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    # ADR-013 plugin selection: NavfnPlanner (Dijkstra). allow_unknown matters
    # because slam_toolbox's map has many unknown cells during early exploration.
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.105                # TB3 Burger
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /lidar
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0          # matches LDS-02 max range
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.105
      resolution: 0.05
      transform_tolerance: 0.3
      # SAC-6 (2026-05-12): slam_toolbox is not launched during training, so
      # there is no /map publisher to feed a StaticLayer. The global costmap
      # is therefore rolling-window centred on the robot, and observes
      # obstacles directly from /lidar via ObstacleLayer. width/height (12 m)
      # comfortably cover the 10x10 m arena from any point, so Nav2 can still
      # plan to any goal. If SLAM is re-enabled, set rolling_window:false,
      # track_unknown_space:true, and restore the static_layer plugin.
      rolling_window: true
      width: 12
      height: 12
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /lidar
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true
